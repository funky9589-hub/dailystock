name: Daily Pre-Market Newsletter

on:
  # 改由外部精準定時器（cron-job.org）透過 workflow_dispatch API 每日台灣時間 08:25 準時觸發，
  # 避開 GitHub 免費 schedule 排程的數小時延遲問題，同時也支援隨時在 GitHub 網頁手動點擊測試。
  workflow_dispatch:
    inputs:
      test_self:
        description: "僅寄給自己測試（不群發給其他訂閱者）"
        type: boolean
        default: false

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CJK font for Taiwan stock cards
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and send daily pre-market newsletter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          MARKET_FOCUS: ${{ secrets.MARKET_FOCUS }}
          INTERACTIVE_URL: ${{ secrets.INTERACTIVE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test_self }}" = "true" ]; then
            python main.py --test-self
          else
            python main.py
          fi

      - name: Publish interactive flip-card page to docs/index.html (GitHub Pages)
        run: |
          if [ -f docs/index.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            if ! git diff --cached --quiet; then
              git commit -m "chore: update daily interactive flip-card report"
              git push
            fi
          fi
